<!DOCTYPE html>
<html>
<head>
    <title>Goal Heatmap</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #17191c;
            color: white;
            padding: 30px;
        }

        .heatmap {
            display: grid;
            grid-template-columns: 100px repeat(5, 70px);
            gap: 5px;
            width: max-content;
        }

        .cell {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: bold;
        }

        .header {
            color: #9da5ae;
            background: #202328;
        }

        .goal {
            background: #202328;
            color: #67b8ef;
        }
    </style>
</head>

<body>

<h2>Goal Progress Heatmap</h2>

<div class="heatmap">

    <div></div>
    <div class="cell header">W1</div>
    <div class="cell header">W2</div>
    <div class="cell header">W3</div>
    <div class="cell header">W4</div>
    <div class="cell header">W5</div>

    <div class="cell goal">A</div>
    <div class="cell" data-value="25">25</div>
    <div class="cell" data-value="40">40</div>
    <div class="cell" data-value="55">55</div>
    <div class="cell" data-value="70">70</div>
    <div class="cell" data-value="85">85</div>

    <div class="cell goal">B</div>
    <div class="cell" data-value="10">10</div>
    <div class="cell" data-value="25">25</div>
    <div class="cell" data-value="40">40</div>
    <div class="cell" data-value="55">55</div>
    <div class="cell" data-value="70">70</div>

    <div class="cell goal">C</div>
    <div class="cell" data-value="50">50</div>
    <div class="cell" data-value="55">55</div>
    <div class="cell" data-value="65">65</div>
    <div class="cell" data-value="75">75</div>
    <div class="cell" data-value="90">90</div>

    <div class="cell goal">D</div>
    <div class="cell" data-value="15">15</div>
    <div class="cell" data-value="20">20</div>
    <div class="cell" data-value="35">35</div>
    <div class="cell" data-value="45">45</div>
    <div class="cell" data-value="60">60</div>

    <div class="cell goal">E</div>
    <div class="cell" data-value="30">30</div>
    <div class="cell" data-value="45">45</div>
    <div class="cell" data-value="60">60</div>
    <div class="cell" data-value="75">75</div>
    <div class="cell" data-value="95">95</div>

</div>

<script>
    document.querySelectorAll("[data-value]").forEach(cell => {

        const value = Number(cell.dataset.value);

        let color;

        if (value < 25) {
            color = "#8b1e1e";       // dark red
        } 
        else if (value < 50) {
            color = "#d65a00";       // orange
        } 
        else if (value < 75) {
            color = "#d6a800";       // yellow
        } 
        else {
            color = "#4f9d45";       // green
        }

        cell.style.background = color;
    });
</script>

</body>
</html>
